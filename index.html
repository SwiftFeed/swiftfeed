<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWIFTFEED ⚡</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-6">
    <div class="max-w-md mx-auto">
        <h1 class="text-3xl font-black mb-8 italic">SWIFTFEED</h1>
        
        <div class="bg-slate-900 p-4 rounded-2xl mb-8 border border-white/10 text-black">
            <textarea id="msg" class="w-full bg-transparent text-white outline-none mb-4" placeholder="Scrie ceva..."></textarea>
            <button onclick="send()" class="bg-indigo-600 text-white w-full py-3 rounded-xl font-bold">POSTEAZĂ</button>
        </div>

        <div id="feed" class="space-y-4"></div>
    </div>

    <script>
        const URL = 'https://nalfxquuzexpkykapwnl.supabase.co';
        const KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hbGZ4cXd1emV4cGt5a2Fwd25sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNDYxMTUsImV4cCI6MjA5MTkyMjExNX0.wCuQ4Dnw49XjxczzzoVUAtxIQOFZZLDh_zmJMYTCywk';
        const sb = supabase.createClient(URL, KEY);

        async function load() {
            const { data } = await sb.from('posts').select('*').order('created_at', { ascending: false });
            const f = document.getElementById('feed');
            f.innerHTML = '';
            data?.forEach(p => {
                f.innerHTML += `<div class="bg-slate-900 p-4 rounded-xl border border-white/5"><p>${p.text}</p></div>`;
            });
        }

        async function send() {
            const t = document.getElementById('msg').value;
            if(!t) return;
            await sb.from('posts').insert([{ text: t, user: 'iPhone' }]);
            document.getElementById('msg').value = '';
            load();
        }
        load();
        setInterval(load, 5000);
    </script>
</body>
</html>
